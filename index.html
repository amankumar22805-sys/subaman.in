<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Subaman.in</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f9f9f9; }
    header { background: royalblue; color:white; padding:15px; display:flex; justify-content:space-between; align-items:center; }
    header h1 { margin:0; font-size:20px; }
    .search-bar { flex:1; margin:0 20px; }
    .search-bar input { width:100%; padding:8px; border-radius:5px; border:none; }
    .products { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; padding:20px; }
    .card { background:white; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1); padding:15px; text-align:center; }
    .card img { width:100%; height:150px; object-fit:cover; border-radius:5px; }
    .card button { background:darkblue; color:yellow; border:none; padding:10px; margin-top:10px; cursor:pointer; border-radius:5px; }
    .form-popup { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; }
    .form-box { background:white; padding:20px; border-radius:8px; width:300px; }
    .form-box input { width:100%; margin:8px 0; padding:8px; }
    .form-box button { background:royalblue; color:white; border:none; padding:10px; width:100%; margin-top:10px; }
  </style>
</head>
<body>
  <header>
    <h1>Subaman.in</h1>
    <div class="search-bar"><input type="text" placeholder="Search products..."></div>
    <span>🛍️ Customize Shop</span>
  </header>

  <section class="products">
    <div class="card">
      <img src="tshirt.jpg" alt="T-shirt">
      <h3>Customized T-shirt</h3>
      <p>₹300</p>
      <button onclick="openForm('T-shirt')">Order Now</button>
    </div>
    <div class="card">
      <img src="mug.jpg" alt="Mug">
      <h3>Customized Mug</h3>
      <p>₹250</p>
      <button onclick="openForm('Mug')">Order Now</button>
    </div>
    <!-- Add more products here -->
  </section>

  <div class="form-popup" id="orderForm">
    <div class="form-box">
      <h2>Order Form</h2>
      <input type="file" id="imageUpload" accept="image/*">
      <input type="text" placeholder="Name">
      <input type="text" placeholder="Address">
      <input type="text" placeholder="Mobile">
      <input type="text" placeholder="WhatsApp">
      <p>Pay via UPI: <b>9113737645@axl</b></p>
      <input type="text" placeholder="Enter UTR Number">
      <button onclick="confirmOrder()">Confirm Order</button>
    </div>
  </div>

  <script>
    function openForm(product){
      document.getElementById('orderForm').style.display='flex';
    }
    function confirmOrder(){
      alert("✅ Order Successful! We will confirm soon.");
      document.getElementById('orderForm').style.display='none';
    }
  </script>
</body>
</html>
